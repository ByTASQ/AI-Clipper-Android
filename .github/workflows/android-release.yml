name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -d "$SDK_ROOT/platforms"

          # The runner currently ships Android 37 as android-37.0.
          # Gradle/AGP requires the exact platforms;android-37 package path.
          # Make a real standalone SDK package and remove the conflicting
          # android-37.0 package so the SDK locator cannot reject it.
          if [ ! -f "$SDK_ROOT/platforms/android-37/android.jar" ]; then
            test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
            rm -rf "$SDK_ROOT/platforms/android-37"
            cp -a "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi

          cat > "$SDK_ROOT/platforms/android-37/source.properties" <<'EOF'
Pkg.Desc=Android SDK Platform 37
Pkg.Revision=2
Pkg.Path=platforms;android-37
EOF

          rm -rf "$SDK_ROOT/platforms/android-37.0"

          test ! -L "$SDK_ROOT/platforms/android-37"
          test -f "$SDK_ROOT/platforms/android-37/android.jar"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          echo "Android SDK: $SDK_ROOT"
          find "$SDK_ROOT/platforms" -maxdepth 1 -type d -name 'android-37*' -print
          grep -E '^Pkg.Path=|^Pkg.Revision=' "$SDK_ROOT/platforms/android-37/source.properties"
          ls -l "$SDK_ROOT/platforms/android-37/android.jar"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare current yt-dlp wheel
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/ytdlp
          python3 -m pip download --no-deps --only-binary=:all: yt-dlp==2026.10.26 -d "$RUNNER_TEMP/ytdlp"
          test -f "$RUNNER_TEMP/ytdlp/yt_dlp-2026.10.26-py3-none-any.whl"
          cp "$RUNNER_TEMP/ytdlp/yt_dlp-2026.10.26-py3-none-any.whl" app/src/main/assets/ytdlp/

      - name: Check signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "ANDROID_KEYSTORE_BASE64 secret is missing" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "ANDROID_KEYSTORE_PASSWORD secret is missing" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "ANDROID_KEY_ALIAS secret is missing" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "ANDROID_KEY_PASSWORD secret is missing" && exit 1)

      - name: Decode release keystore and show SHA-1
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" |
            grep -E "Alias name:|SHA1:|SHA-1:"

      - name: Prepare RunAnywhere Kotlin Maven repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runanywhere-maven
          mkdir -p .runanywhere-maven
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/RunanywhereAI/runanywhere-sdks/releases/download/v0.20.37/runanywhere-kotlin-maven-v0.20.37.zip" \
            -o "$RUNNER_TEMP/runanywhere-kotlin-maven.zip"
          unzip -q "$RUNNER_TEMP/runanywhere-kotlin-maven.zip" -d "$RUNNER_TEMP/runanywhere-maven"
          test -d "$RUNNER_TEMP/runanywhere-maven/repository"
          cp -R "$RUNNER_TEMP/runanywhere-maven/repository" .runanywhere-maven/
          test -f ".runanywhere-maven/repository/io/github/sanchitmonga22/runanywhere-sdk/0.20.37/runanywhere-sdk-0.20.37.pom"
          test -f ".runanywhere-maven/repository/io/github/sanchitmonga22/runanywhere-llamacpp/0.20.37/runanywhere-llamacpp-0.20.37.pom"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-clipper-release
          path: app/build/outputs/apk/release/*.apk
